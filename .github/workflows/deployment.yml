name: deploying
on: push
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: lint the code
      - run: npm run lint
      - name: checkout the code
      - run: actions/checkout@v3
      - name: test the code
      - run: npm build test
      - name: deployed the code
      - run: echo "deployed succesfully"