name: second-workflow
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install NodeJs
        uses: actions/setup-node@v3
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: run tests
        run: npm test  
  deploy:
    run-on: ubuntu-latest
    steps:
      - name: Deploy the code
        uses: actions/checkout@v3
      - name: Install NodeJs
        uses: actions/setup-node@v3
        with:
          node-version: 24  
      - name: Install dependencies
        run: npm ci
      - name: deploy
        run: npm run build    